name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type-check + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev deps
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src/ tests/

      - name: Mypy
        run: uv run --python ${{ matrix.python-version }} mypy src/

      - name: Pytest
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -ra
